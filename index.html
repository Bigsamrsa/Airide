<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiRide SAFE - Email KYC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;padding:12px}
.card{background:#1e293b;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid #334155}
.toggle{display:flex;background:#0f172a;border-radius:30px;padding:4px;border:1px solid #334155;margin-bottom:10px}
.toggle button{padding:8px 10px;border-radius:20px;border:none;font-weight:bold;font-size:11px;cursor:pointer}
.active{color:#fff}.r-on{background:#0ea5e9}.d-on{background:#22c55e;color:#000}.a-on{background:#a855f7}
.wallet{font-size:28px;color:#22c55e;text-align:center;font-weight:900}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin:4px 0}
.btn{width:100%;padding:11px;border-radius:8px;border:none;font-weight:900;cursor:pointer;margin-top:5px;font-size:12px}
.btn-green{background:#22c55e;color:#000}.btn-blue{background:#0ea5e9;color:#fff}.btn-dark{background:#334155;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-gold{background:#facc15;color:#000}
.photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #22c55e;display:block;margin:6px auto}
.idphoto{width:100%;height:100px;object-fit:cover;border-radius:8px;border:2px solid #334155}
.upload-box{background:#0f172a;border:2px dashed #334155;border-radius:10px;padding:8px;text-align:center;margin:5px 0}
.upload-box.ok{border-color:#22c55e;background:#1a2e1a}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:900}
.b-pending{background:#facc15;color:#000}.b-verified{background:#22c55e;color:#000}.b-rejected{background:#ef4444;color:#fff}.b-email{background:#0ea5e9;color:#fff}
.driver-card{background:#0f172a;padding:10px;border-radius:10px;margin:8px 0}
.kyc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}
.small{opacity:.7;font-size:11px}
.verified-box{background:#1a2e1a;border:1px solid #22c55e;border-radius:8px;padding:8px;margin:5px 0;text-align:center}
</style>
</head>
<body>
<div class="card" style="text-align:center"><b>🚗 AiRide SAFE 🛡️</b><br><span class="small">Email + KYC Verified</span></div>
<div class="toggle">
<button id="bR" onclick="setMode('rider')">Rider</button>
<button id="bD" onclick="setMode('driver')">Driver</button>
<button id="bA" onclick="askAdmin()">Admin</button>
</div>

<div id="riderView">
<div class="card">💰 Wallet<div class="wallet" id="wallet">R0</div><input id="vCode" placeholder="Voucher"><button class="btn btn-green" onclick="redeem()">Redeem</button></div>
<div class="card">🚕 Request<input id="from" placeholder="From"><input id="to" placeholder="To"><button class="btn btn-blue" onclick="requestRide()">Find Driver</button><div id="rideStatus" class="small"></div></div>
</div>

<div id="driverView" style="display:none">
<div id="regForm" class="card" style="border:2px solid #22c55e">
<b>👩‍✈️ Driver Registration - Email + KYC</b><br><span class="small">Email verification + 3 photos required</span>

<!-- EMAIL VERIFICATION -->
<div id="emailSection" class="card" style="background:#0f172a;border:2px dashed #0ea5e9;margin:8px 0">
<b>📧 Email Verification *</b>
<input id="dEmail" type="email" placeholder="Email e.g. noma@gmail.com">
<button class="btn btn-blue" id="sendCodeBtn" onclick="sendEmailCode()">📨 Send Verification Code</button>
<div id="otpSection" style="display:none">
<input id="otpInput" placeholder="Enter 6-digit code from email">
<button class="btn btn-green" onclick="verifyEmailCode()">✅ Verify Email</button>
<div class="small">Code sent to your email (Demo code: <b id="demoCode"></b>
